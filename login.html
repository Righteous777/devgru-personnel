<!doctype html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-fNycbvgFr2BBnXiwqn2wU57IzYr9QHSxliI8P3Mv0EE=' https://hcaptcha.com https://*.hcaptcha.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://hcaptcha.com https://*.hcaptcha.com; connect-src https://*.supabase.co https://hcaptcha.com https://*.hcaptcha.com; frame-src 'self' blob: https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVGRU Staff Access</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#39151b,#090a0d 65%);color:#f1eee8;font:15px system-ui}main{width:min(420px,90vw);box-sizing:border-box;border:1px solid #86633d;background:#14171b;padding:32px;border-radius:12px}small,a{color:#d7b578}label{display:block;margin:18px 0 5px}input,button{width:100%;box-sizing:border-box;padding:12px;background:#090c0f;color:white;border:1px solid #454545;border-radius:5px;font:inherit}button{margin:20px 0;background:#c9a66b;color:#111;font-weight:bold;cursor:pointer}#err{color:#ffabab}</style></head><body><main><small>DEVGRU / PERSONNEL COMMAND</small><h1>STAFF ACCESS</h1><p>Authorized roster administrators only.</p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div id="captcha"></div><button>Sign in</button></form><section id="mfa" hidden><h2>Authenticator verification</h2><p id="instruction"></p><div id="setup" hidden><p>Add a time-based account in your authenticator using this private setup key:</p><code id="secret" style="overflow-wrap:anywhere;user-select:all"></code><p>Never share this key. Store a secure recovery copy or you may lose access.</p></div><form id="verify"><label for="code">Six-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button>Verify and open dashboard</button></form><button id="cancel" type="button">Cancel sign-in</button></section><p id="err" role="alert"></p><a href="./index.html">Public roster</a></main><script src="config.js"></script><script src="cloud.js"></script><script>
const $=id=>document.getElementById(id);let factorId='',captchaWidget=null;
const siteKey=window.DEVGRU_CONFIG?.hcaptchaSiteKey||'';
if(siteKey){const script=document.createElement('script');script.src='https://js.hcaptcha.com/1/api.js?render=explicit';script.onload=()=>{captchaWidget=hcaptcha.render('captcha',{sitekey:siteKey})};script.onerror=()=>{$('err').textContent='CAPTCHA could not load. Reload to retry.'};document.head.append(script)}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('err').textContent='';try{let response=siteKey&&captchaWidget!==null?hcaptcha.getResponse(captchaWidget):'';if(siteKey&&!response)throw Error('Complete the CAPTCHA first.');await cloud.login($('email').value,$('password').value,response);$('password').value='';const list=await cloud.factors();if(list.length){factorId=list[0].id;$('instruction').textContent='Enter the current code from your authenticator app.'}else{const f=await cloud.enroll();factorId=f.id;$('instruction').textContent='First sign-in: enroll your authenticator.';$('secret').textContent=f.totp.secret;$('setup').hidden=false}$('login').hidden=true;$('mfa').hidden=false;$('code').focus()}catch(err){cloud.clear();$('err').textContent=err.message;if(captchaWidget!==null)hcaptcha.reset(captchaWidget);b.disabled=false}};
$('verify').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('err').textContent='';try{await cloud.verify(factorId,$('code').value.trim());$('secret').textContent='';$('code').value='';location.replace('./admin.html')}catch(err){$('err').textContent=err.message;b.disabled=false}};
$('cancel').onclick=()=>{cloud.clear();location.reload()};
</script></body></html>
